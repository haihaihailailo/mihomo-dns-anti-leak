# --- 9. 远程规则集 rule-providers ---
# 从 MetaCubeX meta-rules-dat 拉取常用 geosite/geoip 规则，供 RULE-SET 调用。
# 配置说明：远程规则集合的格式、下载与缓存设置。
rule-providers:
  # 纯广告版：不叠加隐私统计、强制更新、推送/PCDN 拦截；classical 保留精确域名与关键词语义。
  # 配置说明：规则集合 reject；路由与 DNS 中引用该名称，下载内容随上游更新。
  reject:
    # 配置说明：对象类型：select 手选，url-test 自动测速，http 从远端下载规则。
    type: http
    # 配置说明：集合语义：domain 域名、ipcidr 网段、classical 完整规则。
    behavior: classical
    # 配置说明：规则文件编码格式，须与远端内容一致。
    format: yaml
    # 配置说明：定期测速或规则更新的间隔，单位秒，取决于所属对象。
    interval: 86400
    # 配置说明：规则下载大小上限，单位字节。
    size-limit: 4194304
    # 配置说明：下载该规则集合时使用的出站策略。
    proxy: 节点选择
    # 配置说明：组内为测速端点，规则提供器内为下载地址；端点可达不代表业务解锁。
