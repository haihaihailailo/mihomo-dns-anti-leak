# --- 8. 策略组 proxy-groups ---
# 按使用场景组织出口：默认选择、漏网之鱼、国内、越南、AI、Google、流媒体等。
# select 组只提供按需测速地址，不设置 interval，不改变手动选择行为。
# 配置说明：策略组及其候选成员；订阅节点由客户端另行提供。
proxy-groups:

  # 默认主策略组：手动选择或切到各地区自动组、地区节点、全部节点、DIRECT。
  # 配置说明：当前策略组或覆写的显示名称。
  - name: 节点选择
    # 配置说明：对象类型：select 手选，url-test 自动测速，http 从远端下载规则。
    type: select
    # 配置说明：候选策略/节点列表；手选组首次默认取首项，已有保存选择可能优先。
    proxies: [自动选择, 香港-自动, 香港节点, 台湾-自动, 台湾节点, 日本-自动, 日本节点, 新加坡-自动, 新加坡节点, 美国-自动, 美国节点, 韩国-自动, 韩国节点, 越南-自动, 越南节点, 中国-自动, 中国节点, 全部节点, DIRECT]
    # 配置说明：组内为测速端点，规则提供器内为下载地址；端点可达不代表业务解锁。
    url: "https://cp.cloudflare.com/generate_204"
    # 配置说明：测速成功所需的 HTTP 状态码。
    expected-status: 204
    # 配置说明：Mihomo/Stash 此处超时单位为毫秒；超时不等于所有业务均不可用。
    timeout: 10000
    # 配置说明：界面图标地址，不参与规则匹配。
