name: Validate Clash config

on:
  push:
    paths:
      - "防DNS泄露.yaml"
      - "防DNS泄露.js"
      - "防DNS泄露-*版.*"
      - "package.json"
      - "package-lock.json"
      - ".github/scripts/build_profiles.cjs"
      - ".github/scripts/validate_profiles.cjs"
      - "Windows-国内网络覆写.yaml"
      - "Windows-国内网络覆写.js"
      - "stash.stoverride"
      - "shadowrocket.conf"
      - ".github/scripts/validate_health_checks.py"
      - ".github/workflows/validate-config.yml"
  pull_request:
    paths:
      - "防DNS泄露.yaml"
      - "防DNS泄露.js"
      - "防DNS泄露-*版.*"
      - "package.json"
      - "package-lock.json"
      - ".github/scripts/build_profiles.cjs"
      - ".github/scripts/validate_profiles.cjs"
      - "Windows-国内网络覆写.yaml"
      - "Windows-国内网络覆写.js"
      - "stash.stoverride"
      - "shadowrocket.conf"
      - ".github/scripts/validate_health_checks.py"
      - ".github/workflows/validate-config.yml"
  schedule:
    # 每天 04:30 新加坡时间自动校验，及时发现 Mihomo、远程规则或下载链路变化。
    - cron: "30 20 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-sources:
    name: Validate config source consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"

      - name: Parse YAML with aliases enabled
        run: |
          ruby -e 'require "yaml"; ["防DNS泄露.yaml", "防DNS泄露-国内版.yaml", "防DNS泄露-国外版.yaml", "stash.stoverride", "Windows-国内网络覆写.yaml"].each { |file| YAML.safe_load_file(file, aliases: true); puts "#{file} YAML OK" }'

      - name: Check JavaScript syntax
        run: |
          node --version
          node --check "防DNS泄露.js"
          node --check "Windows-国内网络覆写.js"
          node --check "防DNS泄露-国内版.js"
          node --check "防DNS泄露-国外版.js"

      - name: Install pinned config validation dependency
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check routing and health-check topology
        run: python3 .github/scripts/validate_health_checks.py

      - name: Compare YAML and JS full config
        run: |
          ruby <<'RUBY'
          require "json"
          require "open3"
          require "yaml"

          keys = %w[unified-delay profile geo-auto-update geo-update-interval tcp-concurrent sniffer tun dns proxy-groups rule-providers rules]
          yaml_config = YAML.safe_load_file("防DNS泄露.yaml", aliases: true)

          node_code = <<~'NODE'
            const fs = require("fs");
            const vm = require("vm");
            const code = fs.readFileSync("防DNS泄露.js", "utf8");
            const sandbox = { console };
            vm.createContext(sandbox);
            const result = vm.runInContext(`${code}\n;main({});`, sandbox, { filename: "防DNS泄露.js" });
            process.stdout.write(JSON.stringify(result));
          NODE

          stdout, stderr, status = Open3.capture3("node", "-e", node_code)
          unless status.success?
            warn stderr
            abort "Failed to evaluate 防DNS泄露.js"
          end
          js_config = JSON.parse(stdout)

          normalize = lambda do |value, path = []|
            case value
            when Hash
              value.keys.sort.to_h { |key| [key, normalize.call(value[key], path + [key.to_s])] }
            when Array
              values = value.map { |item| normalize.call(item, path) }
              path.last == "ports" ? values.map(&:to_s) : values
            else
              path.last == "expected-status" ? value.to_s : value
            end
          end

          yaml_selected = normalize.call(keys.to_h { |key| [key, yaml_config[key]] })
          js_selected = normalize.call(keys.to_h { |key| [key, js_config[key]] })
          abort "YAML and JS full config are not synchronized" unless yaml_selected == js_selected

          puts "YAML and JS full config are synchronized for: #{keys.join(', ')}."

          local_yaml = YAML.safe_load_file("Windows-国内网络覆写.yaml", aliases: true)
          local_node = <<~'NODE'
            const fs = require("fs");
            const vm = require("vm");
            const assert = require("assert/strict");
            const sandbox = {};
            vm.createContext(sandbox);
            vm.runInContext(fs.readFileSync("Windows-国内网络覆写.js", "utf8"), sandbox);
            const base = {mode: "global", ipv6: true, tun: {enable: false}, dns: {
              fallback: ["https://1.1.1.1/dns-query#节点选择"],
              "nameserver-policy": {"rule-set:openai": ["https://1.1.1.1/dns-query#节点选择"]}
            }, "proxy-groups": [{name: "AI", type: "select", proxies: ["DIRECT"]}], rules: ["MATCH,AI"]};
            const before = JSON.stringify(base);
            const result = JSON.parse(JSON.stringify(sandbox.main(base)));
            assert.equal(JSON.stringify(base), before);
            for (const key of ["mode", "ipv6", "tun", "proxy-groups", "rules"]) assert.deepEqual(result[key], base[key]);
            for (const key of ["fallback", "nameserver-policy"]) assert.deepEqual(result.dns[key], base.dns[key]);
            delete result.dns.fallback;
            delete result.dns["nameserver-policy"];
            process.stdout.write(JSON.stringify({"find-process-mode": result["find-process-mode"], dns: result.dns}));
          NODE
          local_stdout, local_stderr, local_status = Open3.capture3("node", "-e", local_node)
          abort local_stderr unless local_status.success?
          abort "Windows supplemental YAML/JS differ" unless local_yaml == JSON.parse(local_stdout)
          puts "Windows supplemental YAML/JS match and preserve client mode, TUN, IPv6 and routing."
          RUBY

      - name: Check rule references
        run: |
          ruby <<'RUBY'
          require "yaml"

          files = ["防DNS泄露.yaml", "stash.stoverride"]
          built_in = %w[DIRECT REJECT REJECT-DROP REJECT-TINYGIF PASS COMPATIBLE]
          all_errors = []

          files.each do |file|
            config = YAML.safe_load_file(file, aliases: true)
            groups = Array(config["proxy-groups"])
            group_names = groups.map { |group| group["name"] }.compact
            providers = Hash(config["rule-providers"] || {})
            rules = Array(config["rules"]).map { |rule| rule.to_s.strip }.reject(&:empty?)
            policies = group_names + built_in
            errors = []

            group_names.group_by(&:itself).each { |name, values| errors << "Duplicate proxy group: #{name}" if values.length > 1 }
            rules.group_by(&:itself).each { |rule, values| errors << "Duplicate rule: #{rule}" if values.length > 1 }

            groups.each do |group|
              Array(group["proxies"]).each do |proxy|
                errors << "Proxy group #{group['name']} references unknown proxy/group: #{proxy}" unless policies.include?(proxy)
              end
            end

            rules.each_with_index do |rule, index|
              parts = rule.split(",").map(&:strip)
              type = parts[0]
              if type == "RULE-SET"
                errors << "Rule ##{index + 1} references unknown rule-provider: #{parts[1]}" unless providers.key?(parts[1])
                errors << "Rule ##{index + 1} references unknown policy: #{parts[2]}" unless policies.include?(parts[2])
              elsif type == "MATCH"
                errors << "Rule ##{index + 1} references unknown policy: #{parts[1]}" unless policies.include?(parts[1])
              else
                policy = parts[2]
                errors << "Rule ##{index + 1} is too short: #{rule}" if policy.nil? || policy.empty?
                errors << "Rule ##{index + 1} references unknown policy: #{policy}" if policy && !policies.include?(policy)
              end
            end

            Hash(config.dig("dns", "nameserver-policy") || {}).each_key do |key|
              next unless key.to_s.start_with?("rule-set:")
              provider = key.to_s.sub(/^rule-set:/, "")
              errors << "dns.nameserver-policy references unknown rule-provider: #{provider}" unless providers.key?(provider)
            end

            if errors.empty?
              puts "#{file} reference integrity passed: #{group_names.length} proxy groups, #{providers.length} rule providers, #{rules.length} rules."
            else
              all_errors << "#{file}:"
              errors.each { |error| all_errors << "- #{error}" }
            end
          end

          unless all_errors.empty?
            warn "Reference integrity check failed:"
            warn all_errors.join("\n")
            exit 1
          end
          RUBY

      - name: Check policy semantics
        run: |
          ruby <<'RUBY'
          require "ipaddr"
          require "uri"
          require "yaml"

          main = YAML.safe_load_file("防DNS泄露.yaml", aliases: true)
          stash = YAML.safe_load_file("stash.stoverride", aliases: true)
          errors = []

          encrypted_ip_resolver = lambda do |value|
            uri = URI.parse(value.to_s)
            %w[https tls].include?(uri.scheme) && uri.host && IPAddr.new(uri.host)
          rescue URI::InvalidURIError, IPAddr::InvalidAddressError
            false
          end

          encrypted_resolver = lambda do |value|
            uri = URI.parse(value.to_s)
            %w[https tls].include?(uri.scheme) && !uri.host.to_s.empty?
          rescue URI::InvalidURIError
            false
          end

          dns = Hash(main["dns"] || {})
          tun = Hash(main["tun"] || {})
          bootstrap = Array(dns["default-nameserver"])
          direct_dns = Array(dns["direct-nameserver"])
          external_dns = [
            "https://1.1.1.1/dns-query#节点选择",
            "https://8.8.8.8/dns-query#节点选择"
          ]

          errors << "main default-nameserver must use encrypted IP-based resolvers" unless bootstrap.any? && bootstrap.all? { |item| encrypted_ip_resolver.call(item) }
          errors << "main direct-nameserver must use encrypted resolvers" unless direct_dns.any? && direct_dns.all? { |item| encrypted_resolver.call(item) }
          errors << "direct-nameserver-follow-policy must be true" unless dns["direct-nameserver-follow-policy"] == true
          domestic_dns = ["https://223.5.5.5/dns-query", "https://doh.pub/dns-query"]
          %w[yhglobal.com .yhglobal.com].each do |policy|
            errors << "yhglobal DNS must use domestic resolvers: #{policy}" unless Array(Hash(dns["nameserver-policy"])[policy]) == domestic_dns
          end
          errors << "yhglobal must follow 国内服务" unless Array(main["rules"]).include?("DOMAIN-SUFFIX,yhglobal.com,国内服务")
          errors << "external fallback DNS must follow 节点选择" unless Array(dns["fallback"]) == external_dns
          %w[rule-set:geolocation-!cn rule-set:google rule-set:youtube rule-set:openai rule-set:github googleapis.cn .googleapis.cn].each do |policy|
            errors << "external DNS policy #{policy} must follow 节点选择" unless Array(Hash(dns["nameserver-policy"])[policy]) == external_dns
          end

          # IPv6 is intentionally inherited from the client/software instead of being forced by the override.
          errors << "top-level IPv6 must follow client settings" if main.key?("ipv6")
          errors << "dns.ipv6 must follow client settings" if dns.key?("ipv6")
          errors << "fake-ip-range6 must follow client settings" if dns.key?("fake-ip-range6")
          errors << "tun.inet6-address must follow client settings" if tun.key?("inet6-address")

          groups = Array(main["proxy-groups"]).to_h { |group| [group["name"], group] }
          errors << "Vietnam policy must default to DIRECT" unless Array(groups.dig("越南服务", "proxies")).first == "DIRECT"
          errors << "AI policy must prefer an automatic group" unless Array(groups.dig("AI", "proxies")).first.to_s.end_with?("-自动")
          groups.each do |name, group|
            next unless group["include-all"] == true
            errors << "include-all group #{name} must fail closed" unless group["empty-fallback"] == "REJECT"
          end

          rules = Array(main["rules"])
          ad_index = rules.index("RULE-SET,reject,广告过滤")
          first_service_index = rules.index { |rule| rule.to_s.start_with?("PROCESS-NAME,") }
          errors << "ad rule must appear before service rules" unless ad_index && first_service_index && ad_index < first_service_index

          Hash(main["rule-providers"] || {}).each do |name, provider|
            errors << "rule-provider #{name} must download through 节点选择" unless provider["proxy"] == "节点选择"
            errors << "rule-provider #{name} must use a 4 MiB size limit" unless provider["size-limit"] == 4_194_304
          end

          stash_dns = Hash(stash["dns"] || {})
          errors << "Stash top-level IPv6 must follow client settings" if stash.key?("ipv6")
          errors << "Stash dns.ipv6 must follow client settings" if stash_dns.key?("ipv6")
          errors << "Stash DNS must follow routing rules" unless stash_dns["follow-rule"] == true
          errors << "Stash default-nameserver must use encrypted IP-based resolvers" unless Array(stash_dns["default-nameserver"]).any? && Array(stash_dns["default-nameserver"]).all? { |item| encrypted_ip_resolver.call(item) }
          errors << "Stash proxy-server-nameserver must use encrypted IP-based resolvers" unless Array(stash_dns["proxy-server-nameserver"]).any? && Array(stash_dns["proxy-server-nameserver"]).all? { |item| encrypted_ip_resolver.call(item) }
          Hash(stash["rule-providers"] || {}).each do |name, provider|
            errors << "Stash rule-provider #{name} still uses GitHub Raw" if provider["url"].to_s.include?("raw.githubusercontent.com")
          end

          country_codes = {
            "香港" => "HK", "台湾" => "TW", "日本" => "JP", "新加坡" => "SG",
            "美国" => "US", "韩国" => "KR", "越南" => "VN", "中国" => "CN"
          }
          [main, stash].each do |config|
            group_map = Array(config["proxy-groups"]).to_h { |group| [group["name"], group] }
            country_codes.each do |region, code|
              ["#{region}节点", "#{region}-自动"].each do |name|
                filter = group_map.dig(name, "filter").to_s
                boundary = if region == "中国"
                  "(^|[^A-Z])CN(?!2(?:[^0-9]|$))([^A-Z]|$)"
                else
                  "(^|[^A-Z])#{code}([^A-Z]|$)"
                end
                errors << "#{name} filter lacks a bounded #{code} token" unless filter.include?(boundary)
              end
            end
          end

          unless errors.empty?
            warn errors.map { |error| "- #{error}" }.join("\n")
            exit 1
          end
          puts "Policy semantic checks passed."
          RUBY

  validate-mihomo:
    name: Load config with Mihomo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate-sources
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download latest Mihomo
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_json="$(curl --retry 3 --retry-delay 2 --retry-connrefused -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest)"
          url="$(echo "$release_json" | jq -r '.assets[] | select(.name | test("^mihomo-linux-amd64-v1-v.*\\.gz$")) | .browser_download_url' | head -n 1)"
          if [ -z "$url" ]; then
            echo "No linux amd64 v1 Mihomo asset found" >&2
            exit 1
          fi
          curl --retry 3 --retry-delay 2 --retry-connrefused -fsSL "$url" -o mihomo.gz
          gzip -d mihomo.gz
          chmod +x mihomo
          ./mihomo -v

      - name: Test config load
        run: |
          ./mihomo -t -f "防DNS泄露.yaml"
          ./mihomo -t -f "防DNS泄露-国内版.yaml"
          ./mihomo -t -f "防DNS泄露-国外版.yaml"
