name: Validate Clash config

on:
  push:
    paths:
      - "maintenance/**"
      - ".github/scripts/test_openclash_maintenance.rb"
      - ".github/scripts/test_sub_store_flow.cjs"
      - ".github/config/shared.yaml"
      - ".github/config/shared.js"
      - ".github/scripts/config_comments.cjs"
      - ".github/scripts/validate_config_comments.cjs"
      - "防DNS泄露-*版.*"
      - "package.json"
      - "package-lock.json"
      - "AGENTS.md"
      - ".github/artifact-policy.json"
      - ".github/scripts/artifact_lifecycle.cjs"
      - ".github/scripts/artifact_usage.ps1"
      - ".github/scripts/validate_artifact_lifecycle.cjs"
      - ".github/dependabot.yml"
      - ".github/scripts/validate_compatibility.cjs"
      - ".github/scripts/build_profiles.cjs"
      - ".github/scripts/build_router_profiles.cjs"
      - ".github/scripts/validate_router_profiles.cjs"
      - ".github/scripts/*telegram*.rb"
      - ".github/scripts/*openclash_node_aliases.rb"
      - ".github/scripts/node_server_aliases.cjs"
      - ".github/scripts/validate_node_server_aliases.cjs"
      - ".github/scripts/probe_subscription_capabilities.*"
      - ".github/scripts/validate_profiles.cjs"
      - ".github/scripts/validate_rule_sources.cjs"
      - ".github/scripts/validate_priority.cjs"
      - ".github/scripts/validate_ssh_direct.cjs"
      - ".github/scripts/in_th_guard.cjs"
      - ".github/scripts/validate_service_ownership.cjs"
      - ".github/scripts/check_remote_rules.cjs"
      - ".github/scripts/check_health_endpoints.cjs"
      - ".github/workflows/check-health-endpoints.yml"
      - ".github/scripts/validate_mihomo_runtime.cjs"
      - ".github/scripts/consolidate_groups.cjs"
      - ".github/scripts/validate_consolidation.cjs"
      - ".github/scripts/tune_mihomo.cjs"
      - ".github/scripts/validate_mihomo_tuning.cjs"
      - ".github/scripts/validate_health_checks.py"
      - ".github/workflows/validate-config.yml"
  pull_request:
    paths:
      - "maintenance/**"
      - ".github/scripts/test_openclash_maintenance.rb"
      - ".github/scripts/test_sub_store_flow.cjs"
      - ".github/config/shared.yaml"
      - ".github/config/shared.js"
      - ".github/scripts/config_comments.cjs"
      - ".github/scripts/validate_config_comments.cjs"
      - "防DNS泄露-*版.*"
      - "package.json"
      - "package-lock.json"
      - "AGENTS.md"
      - ".github/artifact-policy.json"
      - ".github/scripts/artifact_lifecycle.cjs"
      - ".github/scripts/artifact_usage.ps1"
      - ".github/scripts/validate_artifact_lifecycle.cjs"
      - ".github/dependabot.yml"
      - ".github/scripts/validate_compatibility.cjs"
      - ".github/scripts/build_profiles.cjs"
      - ".github/scripts/build_router_profiles.cjs"
      - ".github/scripts/validate_router_profiles.cjs"
      - ".github/scripts/*telegram*.rb"
      - ".github/scripts/*openclash_node_aliases.rb"
      - ".github/scripts/node_server_aliases.cjs"
      - ".github/scripts/validate_node_server_aliases.cjs"
      - ".github/scripts/probe_subscription_capabilities.*"
      - ".github/scripts/validate_profiles.cjs"
      - ".github/scripts/validate_rule_sources.cjs"
      - ".github/scripts/validate_priority.cjs"
      - ".github/scripts/validate_ssh_direct.cjs"
      - ".github/scripts/in_th_guard.cjs"
      - ".github/scripts/validate_service_ownership.cjs"
      - ".github/scripts/check_remote_rules.cjs"
      - ".github/scripts/check_health_endpoints.cjs"
      - ".github/workflows/check-health-endpoints.yml"
      - ".github/scripts/validate_mihomo_runtime.cjs"
      - ".github/scripts/consolidate_groups.cjs"
      - ".github/scripts/validate_consolidation.cjs"
      - ".github/scripts/tune_mihomo.cjs"
      - ".github/scripts/validate_mihomo_tuning.cjs"
      - ".github/scripts/validate_health_checks.py"
      - ".github/workflows/validate-config.yml"
  schedule:
    # 每天 04:30 新加坡时间自动校验，及时发现 Mihomo、远程规则或下载链路变化。
    - cron: "30 20 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-sources:
    name: Validate config source consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"

      - name: Parse YAML with aliases enabled
        run: |
          ruby -e 'require "yaml"; [".github/config/shared.yaml", "防DNS泄露-国内版.yaml", "防DNS泄露-国外版.yaml"].each { |file| YAML.safe_load_file(file, aliases: true); puts "#{file} YAML OK" }'

      - name: Check JavaScript syntax
        run: |
          node --version
          node --check ".github/config/shared.js"
          node --check "防DNS泄露-国内版.js"
          node --check "防DNS泄露-国外版.js"
          node --check ".github/scripts/build_router_profiles.cjs"
          node --check ".github/scripts/validate_router_profiles.cjs"

      - name: Check OpenClash YAML 1.1 string compatibility
        run: |
          ruby <<'RUBY'
          require 'yaml'
          %w[国内 国外].each do |region|
            file = "防DNS泄露-路由器-#{region}版.yaml"
            config = YAML.safe_load_file(file, aliases: true)
            raise "find-process-mode must be string off" unless config['find-process-mode'] == 'off'
            puts "#{file} Ruby YAML OK"
          end
          RUBY

      - name: Install pinned config validation dependency
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check routing and health-check topology
        env:
          OPENCLASH_RUBY_TEST: "1"
        run: python3 .github/scripts/validate_health_checks.py

      - name: Compare YAML and JS full config
        run: |
          ruby <<'RUBY'
          require "json"
          require "open3"
          require "yaml"

          keys = %w[profile geo-auto-update geo-update-interval tcp-concurrent sniffer tun dns proxy-groups rule-providers rules]
          yaml_config = YAML.safe_load_file(".github/config/shared.yaml", aliases: true)

          node_code = <<~'NODE'
            const fs = require("fs");
            const vm = require("vm");
            const code = fs.readFileSync(".github/config/shared.js", "utf8");
            const sandbox = { console };
            vm.createContext(sandbox);
            const result = vm.runInContext(`${code}\n;main({});`, sandbox, { filename: ".github/config/shared.js" });
            process.stdout.write(JSON.stringify(result));
          NODE

          stdout, stderr, status = Open3.capture3("node", "-e", node_code)
          unless status.success?
            warn stderr
            abort "Failed to evaluate .github/config/shared.js"
          end
          js_config = JSON.parse(stdout)

          if yaml_config.key?("unified-delay") || js_config.key?("unified-delay")
            abort "unified-delay is client-owned and must not be distributed by the shared template"
          end

          normalize = lambda do |value, path = []|
            case value
            when Hash
              value.keys.sort.to_h { |key| [key, normalize.call(value[key], path + [key.to_s])] }
            when Array
              values = value.map { |item| normalize.call(item, path) }
              path.last == "ports" ? values.map(&:to_s) : values
            else
              path.last == "expected-status" ? value.to_s : value
            end
          end

          yaml_selected = normalize.call(keys.to_h { |key| [key, yaml_config[key]] })
          js_selected = normalize.call(keys.to_h { |key| [key, js_config[key]] })
          abort "YAML and JS full config are not synchronized" unless yaml_selected == js_selected

          puts "YAML and JS full config are synchronized for: #{keys.join(', ')}."

          RUBY

      - name: Check rule references
        run: |
          ruby <<'RUBY'
          require "yaml"

          files = [".github/config/shared.yaml"]
          built_in = %w[DIRECT REJECT REJECT-DROP REJECT-TINYGIF PASS COMPATIBLE]
          all_errors = []

          files.each do |file|
            config = YAML.safe_load_file(file, aliases: true)
            groups = Array(config["proxy-groups"])
            group_names = groups.map { |group| group["name"] }.compact
            providers = Hash(config["rule-providers"] || {})
            rules = Array(config["rules"]).map { |rule| rule.to_s.strip }.reject(&:empty?)
            policies = group_names + built_in
            errors = []

            group_names.group_by(&:itself).each { |name, values| errors << "Duplicate proxy group: #{name}" if values.length > 1 }
            rules.group_by(&:itself).each { |rule, values| errors << "Duplicate rule: #{rule}" if values.length > 1 }

            groups.each do |group|
              Array(group["proxies"]).each do |proxy|
                errors << "Proxy group #{group['name']} references unknown proxy/group: #{proxy}" unless policies.include?(proxy)
              end
            end

            rules.each_with_index do |rule, index|
              parts = rule.split(",").map(&:strip)
              type = parts[0]
              if type == "RULE-SET"
                errors << "Rule ##{index + 1} references unknown rule-provider: #{parts[1]}" unless providers.key?(parts[1])
                errors << "Rule ##{index + 1} references unknown policy: #{parts[2]}" unless policies.include?(parts[2])
              elsif type == "MATCH"
                errors << "Rule ##{index + 1} references unknown policy: #{parts[1]}" unless policies.include?(parts[1])
              elsif ["AND", "OR", "NOT"].include?(type)
                errors << "Rule ##{index + 1} references unknown policy: #{parts[-1]}" unless policies.include?(parts[-1])
                rule.scan(/\(RULE-SET,([^,)]+)/).flatten.each do |provider|
                  errors << "Rule ##{index + 1} references unknown nested rule-provider: #{provider}" unless providers.key?(provider)
                end
              else
                policy = parts[2]
                errors << "Rule ##{index + 1} is too short: #{rule}" if policy.nil? || policy.empty?
                errors << "Rule ##{index + 1} references unknown policy: #{policy}" if policy && !policies.include?(policy)
              end
            end

            Hash(config.dig("dns", "nameserver-policy") || {}).each_key do |key|
              next unless key.to_s.start_with?("rule-set:")
              provider = key.to_s.sub(/^rule-set:/, "")
              errors << "dns.nameserver-policy references unknown rule-provider: #{provider}" unless providers.key?(provider)
            end

            if errors.empty?
              puts "#{file} reference integrity passed: #{group_names.length} proxy groups, #{providers.length} rule providers, #{rules.length} rules."
            else
              all_errors << "#{file}:"
              errors.each { |error| all_errors << "- #{error}" }
            end
          end

          unless all_errors.empty?
            warn "Reference integrity check failed:"
            warn all_errors.join("\n")
            exit 1
          end
          RUBY

      - name: Check policy semantics
        run: |
          ruby <<'RUBY'
          require "ipaddr"
          require "uri"
          require "yaml"

          main = YAML.safe_load_file(".github/config/shared.yaml", aliases: true)
          errors = []

          encrypted_ip_resolver = lambda do |value|
            uri = URI.parse(value.to_s)
            %w[https tls].include?(uri.scheme) && uri.host && IPAddr.new(uri.host)
          rescue URI::InvalidURIError, IPAddr::InvalidAddressError
            false
          end

          encrypted_resolver = lambda do |value|
            uri = URI.parse(value.to_s)
            %w[https tls].include?(uri.scheme) && !uri.host.to_s.empty?
          rescue URI::InvalidURIError
            false
          end

          dns = Hash(main["dns"] || {})
          tun = Hash(main["tun"] || {})
          bootstrap = Array(dns["default-nameserver"])
          direct_dns = Array(dns["direct-nameserver"])
          external_dns = [
            "https://1.1.1.1/dns-query#节点选择",
            "https://8.8.8.8/dns-query#节点选择"
          ]

          errors << "main default-nameserver must use encrypted IP-based resolvers" unless bootstrap.any? && bootstrap.all? { |item| encrypted_ip_resolver.call(item) }
          errors << "main direct-nameserver must use encrypted resolvers" unless direct_dns.any? && direct_dns.all? { |item| encrypted_resolver.call(item) }
          errors << "direct-nameserver-follow-policy must be true" unless dns["direct-nameserver-follow-policy"] == true
          domestic_dns = ["https://223.5.5.5/dns-query", "https://doh.pub/dns-query"]
          %w[yhglobal.com .yhglobal.com].each do |policy|
            errors << "yhglobal DNS must use domestic resolvers: #{policy}" unless Array(Hash(dns["nameserver-policy"])[policy]) == domestic_dns
          end
          errors << "yhglobal must follow 国内服务" unless Array(main["rules"]).include?("DOMAIN-SUFFIX,yhglobal.com,国内服务")
          errors << "external fallback DNS must follow 节点选择" unless Array(dns["fallback"]) == external_dns
          %w[rule-set:geolocation-!cn rule-set:google rule-set:youtube rule-set:openai rule-set:anthropic rule-set:google-gemini rule-set:github-copilot rule-set:github googleapis.cn .googleapis.cn].each do |policy|
            errors << "external DNS policy #{policy} must follow 节点选择" unless Array(Hash(dns["nameserver-policy"])[policy]) == external_dns
          end

          # Top-level IPv6 remains client-owned; shared DNS provides dual-stack fake-ip.
          errors << "top-level IPv6 must follow client settings" if main.key?("ipv6")
          errors << "shared DNS IPv6 must be enabled" unless dns["ipv6"] == true
          errors << "shared IPv6 fake-ip pool is missing or changed" unless dns["fake-ip-range6"] == "fdfe:dcba:9876::1/64"
          errors << "tun.inet6-address must follow client settings" if tun.key?("inet6-address")

          groups = Array(main["proxy-groups"]).to_h { |group| [group["name"], group] }
          errors << "Vietnam policy must default to DIRECT" unless Array(groups.dig("越南服务", "proxies")).first == "DIRECT"
          errors << "AI policy must prefer an automatic group" unless Array(groups.dig("AI", "proxies")).first.to_s.end_with?("-自动")
          groups.each do |name, group|
            next unless group["include-all"] == true
            errors << "include-all group #{name} must fail closed" unless group["empty-fallback"] == "REJECT"
          end

          rules = Array(main["rules"])
          ad_index = rules.index("RULE-SET,reject,广告过滤")
          first_service_index = rules.index { |rule| rule.to_s.start_with?("PROCESS-NAME,") }
          errors << "ad rule must appear before service rules" unless ad_index && first_service_index && ad_index < first_service_index

          Hash(main["rule-providers"] || {}).each do |name, provider|
            errors << "rule-provider #{name} must download through 节点选择" unless provider["proxy"] == "节点选择"
            errors << "rule-provider #{name} must use a 4 MiB size limit" unless provider["size-limit"] == 4_194_304
          end

          country_codes = {
            "香港" => "HK", "台湾" => "TW", "日本" => "JP", "新加坡" => "SG",
            "美国" => "US", "韩国" => "KR", "越南" => "VN", "中国" => "CN"
          }
          [main].each do |config|
            group_map = Array(config["proxy-groups"]).to_h { |group| [group["name"], group] }
            country_codes.each do |region, code|
              ["#{region}节点", "#{region}-自动"].each do |name|
                filter = group_map.dig(name, "filter").to_s
                boundary = if region == "中国"
                  "(^|[^A-Z])CN(?!2(?:[^0-9]|$))([^A-Z]|$)"
                else
                  "(^|[^A-Z])#{code}([^A-Z]|$)"
                end
                errors << "#{name} filter lacks a bounded #{code} token" unless filter.include?(boundary)
              end
            end
          end

          unless errors.empty?
            warn errors.map { |error| "- #{error}" }.join("\n")
            exit 1
          end
          puts "Policy semantic checks passed."
          RUBY

  validate-mihomo:
    name: Load config and initialize public rule snapshots (${{ matrix.mihomo }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate-sources
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        mihomo: ["v1.19.27", "latest"]
    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download and verify selected Mihomo
        id: core
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MIHOMO_RELEASE: ${{ matrix.mihomo }}
        run: |
          set -euo pipefail
          case "$MIHOMO_RELEASE" in
            latest) release_path="latest" ;;
            v1.19.27) release_path="tags/v1.19.27" ;;
            *) echo "Unsupported Mihomo test version" >&2; exit 1 ;;
          esac
          release_json="$(curl --retry 3 --retry-delay 2 --retry-connrefused -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/MetaCubeX/mihomo/releases/$release_path")"
          resolved_tag="$(echo "$release_json" | jq -er 'select(.draft == false and .prerelease == false) | .tag_name')"
          [[ "$resolved_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [ "$MIHOMO_RELEASE" != "latest" ] && [ "$resolved_tag" != "$MIHOMO_RELEASE" ]; then
            echo "Release tag does not match requested version" >&2
            exit 1
          fi
          asset_name="mihomo-linux-amd64-v1-$resolved_tag.gz"
          asset="$(echo "$release_json" | jq -ce --arg name "$asset_name" '.assets | map(select(.name == $name)) | if length == 1 then .[0] else error("Expected one core asset") end')"
          url="$(echo "$asset" | jq -er '.browser_download_url')"
          digest="$(echo "$asset" | jq -er '.digest')"
          [ "$url" = "https://github.com/MetaCubeX/mihomo/releases/download/$resolved_tag/$asset_name" ]
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          curl --retry 3 --retry-delay 2 --retry-connrefused -fsSL "$url" -o mihomo.gz
          printf '%s  mihomo.gz\n' "${digest#sha256:}" | sha256sum --check -
          gzip -d mihomo.gz
          chmod +x mihomo
          version_output="$(./mihomo -v)"
          case "$version_output" in
            "Mihomo Meta $resolved_tag "*) ;;
            *) echo "Downloaded core reports an unexpected version" >&2; exit 1 ;;
          esac
          printf '%s\n' "$version_output"
          # 仅在摘要及实际版本验证成功后导出；诊断步骤不再次执行内核。
          printf 'version=%s\nasset_sha256=%s\n' "$resolved_tag" "${digest#sha256:}" >> "$GITHUB_OUTPUT"

      - name: Install pinned config validation dependency
        id: dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Download and validate public rule payloads
        id: rules
        run: node .github/scripts/check_remote_rules.cjs --output-dir "$GITHUB_WORKSPACE/.generated/runs/rules-check"

      - name: Check isolated DNS priority and initialize all rule snapshots
        id: runtime
        env:
          MIHOMO_TEST_BIN: ${{ github.workspace }}/mihomo
          MIHOMO_RULE_CACHE: ${{ github.workspace }}/.generated/runs/rules-check
          MIHOMO_TEST_OUTPUT: ${{ github.workspace }}/.generated/runs/core-check
        # Hosted ephemeral VM only: /proc occupancy inspection must see root-owned processes.
        # Keep the canonical runner and all fail-closed checks; pass only its three explicit inputs.
        run: >-
          sudo -n env "PATH=$PATH"
          "MIHOMO_TEST_BIN=$MIHOMO_TEST_BIN"
          "MIHOMO_RULE_CACHE=$MIHOMO_RULE_CACHE"
          "MIHOMO_TEST_OUTPUT=$MIHOMO_TEST_OUTPUT"
          python3 .github/scripts/validate_health_checks.py

      - name: Test config load
        id: load
        run: |
          ./mihomo -t -f ".github/config/shared.yaml"
          ./mihomo -t -f "防DNS泄露-国内版.yaml"
          ./mihomo -t -f "防DNS泄露-国外版.yaml"
          ./mihomo -t -f "防DNS泄露-路由器-国内版.yaml"
          ./mihomo -t -f "防DNS泄露-路由器-国外版.yaml"

      - name: Collect public rule diagnostics
        id: diagnostics
        if: ${{ !cancelled() }}
        env:
          CORE_REQUESTED: ${{ matrix.mihomo }}
          CORE_VERSION: ${{ steps.core.outputs.version }}
          CORE_ASSET_SHA256: ${{ steps.core.outputs.asset_sha256 }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          CORE_OUTCOME: ${{ steps.core.outcome }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          RULES_OUTCOME: ${{ steps.rules.outcome }}
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
          LOAD_OUTCOME: ${{ steps.load.outcome }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { createHash } = require('node:crypto');
          const { execFileSync } = require('node:child_process');
          const root = process.env.GITHUB_WORKSPACE;
          const temp = process.env.RUNNER_TEMP;
          const output = path.join(temp, 'config-diagnostics');
          fs.mkdirSync(output); // 独立目录，不预建规则下载器的输出目录。
          const hash = data => createHash('sha256').update(data).digest('hex');
          const readRegular = file => {
            try {
              if (!fs.lstatSync(path.dirname(file)).isDirectory() || !fs.lstatSync(file).isFile())
                throw Error('Diagnostic input must be a regular file');
              return fs.readFileSync(file);
            } catch (error) { if (error.code === 'ENOENT') return null; throw error; }
          };
          const steps = Object.fromEntries(['checkout', 'core', 'dependencies', 'rules', 'runtime', 'load']
            .map(name => [name, process.env[name.toUpperCase() + '_OUTCOME'] || 'unavailable']));
          const configs = ['国内', '国外'].flatMap(region => [
            `防DNS泄露-${region}版.yaml`, `防DNS泄露-${region}版.js`,
            `防DNS泄露-路由器-${region}版.yaml`,
            `防DNS泄露-路由器-${region}版.conf`,
          ]).map(file => {
            const data = steps.checkout === 'success' ? readRegular(path.join(root, file)) : null;
            return { file, sha256: data === null ? null : hash(data) };
          });
          // 只复制明确允许的报告；不上传规则正文、cache.db、订阅或客户端配置。
          const file = '.generated/runs/rules-check/manifest.json';
          const data = readRegular(path.join(root, file));
          const reports = [{ file, status: data === null ? 'missing' : 'present',
            sha256: data === null ? null : hash(data) }];
          if (data !== null) fs.writeFileSync(path.join(output, 'manifest.json'), data, { flag: 'wx' });
          const verified = steps.core === 'success';
          const metadata = {
            schemaVersion: 1,
            checkoutSha: steps.checkout === 'success'
              ? execFileSync('git', ['rev-parse', 'HEAD'], { cwd: root, encoding: 'utf8' }).trim() : null,
            runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            job: process.env.GITHUB_JOB,
            core: { requested: process.env.CORE_REQUESTED,
              verifiedVersion: verified ? process.env.CORE_VERSION || null : null,
              verifiedAssetSha256: verified ? process.env.CORE_ASSET_SHA256 || null : null },
            steps, configs, reports,
          };
          fs.writeFileSync(path.join(output, 'metadata.json'), JSON.stringify(metadata, null, 2) + '\n', { flag: 'wx' });
          NODE

      - name: Upload public rule diagnostics
        if: ${{ !cancelled() && steps.diagnostics.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-${{ github.job }}-${{ matrix.mihomo }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/config-diagnostics/metadata.json
            ${{ runner.temp }}/config-diagnostics/manifest.json
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: false
