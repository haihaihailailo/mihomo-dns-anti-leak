name: Validate health-check topology

on:
  push:
    paths:
      - ".github/config/shared.yaml"
      - ".github/config/shared.js"
      - "防DNS泄露-*版.*"
      - "package.json"
      - "package-lock.json"
      - ".github/scripts/build_profiles.cjs"
      - ".github/scripts/validate_profiles.cjs"
      - ".github/config/shared.stoverride"
      - ".github/config/shared.conf"
      - "stash-*版.stoverride"
      - "shadowrocket-*版.conf"
      - ".github/scripts/build_native_profiles.cjs"
      - ".github/scripts/validate_native_profiles.cjs"
      - ".github/scripts/consolidate_groups.cjs"
      - ".github/scripts/validate_consolidation.cjs"
      - ".github/scripts/validate_health_checks.py"
      - ".github/workflows/validate-health-checks.yml"
  pull_request:
    paths:
      - ".github/config/shared.yaml"
      - ".github/config/shared.js"
      - "防DNS泄露-*版.*"
      - "package.json"
      - "package-lock.json"
      - ".github/scripts/build_profiles.cjs"
      - ".github/scripts/validate_profiles.cjs"
      - ".github/config/shared.stoverride"
      - ".github/config/shared.conf"
      - "stash-*版.stoverride"
      - "shadowrocket-*版.conf"
      - ".github/scripts/build_native_profiles.cjs"
      - ".github/scripts/validate_native_profiles.cjs"
      - ".github/scripts/consolidate_groups.cjs"
      - ".github/scripts/validate_consolidation.cjs"
      - ".github/scripts/validate_health_checks.py"
      - ".github/workflows/validate-health-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate scoped group health checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned config validation dependency
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate proxy-group health-check topology
        run: python3 .github/scripts/validate_health_checks.py
