name: Validate health-check topology

on:
  push:
    paths:
      - "maintenance/**"
      - ".github/scripts/test_openclash_maintenance.rb"
      - ".github/scripts/test_sub_store_flow.cjs"
      - ".github/config/shared.yaml"
      - ".github/config/shared.js"
      - ".github/scripts/config_comments.cjs"
      - ".github/scripts/validate_config_comments.cjs"
      - "防DNS泄露-*版.*"
      - "package.json"
      - "package-lock.json"
      - "AGENTS.md"
      - ".github/artifact-policy.json"
      - ".github/scripts/artifact_lifecycle.cjs"
      - ".github/scripts/artifact_usage.ps1"
      - ".github/scripts/validate_artifact_lifecycle.cjs"
      - ".github/dependabot.yml"
      - ".github/scripts/validate_compatibility.cjs"
      - ".github/scripts/build_profiles.cjs"
      - ".github/scripts/build_router_profiles.cjs"
      - ".github/scripts/validate_router_profiles.cjs"
      - ".github/scripts/*telegram*.rb"
      - ".github/scripts/probe_subscription_capabilities.*"
      - ".github/scripts/*openclash_node_aliases.rb"
      - ".github/scripts/validate_profiles.cjs"
      - ".github/scripts/validate_rule_sources.cjs"
      - ".github/scripts/validate_priority.cjs"
      - ".github/scripts/validate_ssh_direct.cjs"
      - ".github/scripts/in_th_guard.cjs"
      - ".github/scripts/validate_service_ownership.cjs"
      - ".github/scripts/check_remote_rules.cjs"
      - ".github/scripts/check_health_endpoints.cjs"
      - ".github/workflows/check-health-endpoints.yml"
      - ".github/scripts/validate_mihomo_runtime.cjs"
      - ".github/config/shared.stoverride"
      - ".github/config/shared.conf"
      - "stash-*版.stoverride"
      - "shadowrocket-*版.conf"
      - ".github/scripts/build_native_profiles.cjs"
      - ".github/scripts/validate_native_profiles.cjs"
      - ".github/scripts/consolidate_groups.cjs"
      - ".github/scripts/validate_consolidation.cjs"
      - ".github/scripts/tune_mihomo.cjs"
      - ".github/scripts/node_server_aliases.cjs"
      - ".github/scripts/validate_node_server_aliases.cjs"
      - ".github/scripts/validate_mihomo_tuning.cjs"
      - ".github/scripts/validate_health_checks.py"
      - ".github/workflows/validate-health-checks.yml"
  pull_request:
    paths:
      - "maintenance/**"
      - ".github/scripts/test_openclash_maintenance.rb"
      - ".github/scripts/test_sub_store_flow.cjs"
      - ".github/config/shared.yaml"
      - ".github/config/shared.js"
      - ".github/scripts/config_comments.cjs"
      - ".github/scripts/validate_config_comments.cjs"
      - "防DNS泄露-*版.*"
      - "package.json"
      - "package-lock.json"
      - "AGENTS.md"
      - ".github/artifact-policy.json"
      - ".github/scripts/artifact_lifecycle.cjs"
      - ".github/scripts/artifact_usage.ps1"
      - ".github/scripts/validate_artifact_lifecycle.cjs"
      - ".github/dependabot.yml"
      - ".github/scripts/validate_compatibility.cjs"
      - ".github/scripts/build_profiles.cjs"
      - ".github/scripts/build_router_profiles.cjs"
      - ".github/scripts/validate_router_profiles.cjs"
      - ".github/scripts/*telegram*.rb"
      - ".github/scripts/probe_subscription_capabilities.*"
      - ".github/scripts/*openclash_node_aliases.rb"
      - ".github/scripts/validate_profiles.cjs"
      - ".github/scripts/validate_rule_sources.cjs"
      - ".github/scripts/validate_priority.cjs"
      - ".github/scripts/validate_ssh_direct.cjs"
      - ".github/scripts/in_th_guard.cjs"
      - ".github/scripts/validate_service_ownership.cjs"
      - ".github/scripts/check_remote_rules.cjs"
      - ".github/scripts/check_health_endpoints.cjs"
      - ".github/workflows/check-health-endpoints.yml"
      - ".github/scripts/validate_mihomo_runtime.cjs"
      - ".github/config/shared.stoverride"
      - ".github/config/shared.conf"
      - "stash-*版.stoverride"
      - "shadowrocket-*版.conf"
      - ".github/scripts/build_native_profiles.cjs"
      - ".github/scripts/validate_native_profiles.cjs"
      - ".github/scripts/consolidate_groups.cjs"
      - ".github/scripts/validate_consolidation.cjs"
      - ".github/scripts/tune_mihomo.cjs"
      - ".github/scripts/node_server_aliases.cjs"
      - ".github/scripts/validate_node_server_aliases.cjs"
      - ".github/scripts/validate_mihomo_tuning.cjs"
      - ".github/scripts/validate_health_checks.py"
      - ".github/workflows/validate-health-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate scoped group health checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned config validation dependency
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate proxy-group health-check topology
        run: python3 .github/scripts/validate_health_checks.py
