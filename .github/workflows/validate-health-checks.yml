name: Validate health-check topology

on:
  push:
    paths:
      - "防DNS泄露.yaml"
      - "防DNS泄露.js"
      - "防DNS泄露-*版.*"
      - "Windows-国内网络覆写.yaml"
      - "Windows-国内网络覆写.js"
      - "package.json"
      - "package-lock.json"
      - ".github/scripts/build_profiles.cjs"
      - ".github/scripts/validate_profiles.cjs"
      - "stash.stoverride"
      - "shadowrocket.conf"
      - ".github/scripts/validate_health_checks.py"
      - ".github/workflows/validate-health-checks.yml"
  pull_request:
    paths:
      - "防DNS泄露.yaml"
      - "防DNS泄露.js"
      - "防DNS泄露-*版.*"
      - "Windows-国内网络覆写.yaml"
      - "Windows-国内网络覆写.js"
      - "package.json"
      - "package-lock.json"
      - ".github/scripts/build_profiles.cjs"
      - ".github/scripts/validate_profiles.cjs"
      - "stash.stoverride"
      - "shadowrocket.conf"
      - ".github/scripts/validate_health_checks.py"
      - ".github/workflows/validate-health-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate scoped group health checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned config validation dependency
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate proxy-group health-check topology
        run: python3 .github/scripts/validate_health_checks.py
