# OpenClash 路由器国内版远程覆写；自动生成，请勿手改。
# 节点来自本地订阅；仅替换公共分流。端口、认证、TUN、统一延迟、IPv6 由 OpenClash 管理。
# Base64 承载公开 JSON 和仓库内固定 Ruby 适配源码，不是加密；勿添加订阅或凭据。
# 各字段、策略组和逐条规则的明文说明见同目录 防DNS泄露-路由器-国内版.yaml。
# 下方每条命令只写入一个公共字段；不要手动编辑编码正文。
[Overwrite]
# 配置说明：保存策略选择和 fake-ip 映射，供客户端重启后恢复。整段赋值替换该公共字段。
ruby_edit "$CONFIG_FILE" "['profile']" "YAML.safe_load('eyJzdG9yZS1zZWxlY3RlZCI6dHJ1ZSwic3RvcmUtZmFrZS1pcCI6dHJ1ZX0='.unpack1('m0').force_encoding('UTF-8'), aliases: true)"
# 配置说明：允许内核自动更新 GEO 数据。整段赋值替换该公共字段。
ruby_edit "$CONFIG_FILE" "['geo-auto-update']" "YAML.safe_load('ZmFsc2U='.unpack1('m0').force_encoding('UTF-8'), aliases: true)"
# 配置说明：GEO 数据更新间隔，单位小时。整段赋值替换该公共字段。
ruby_edit "$CONFIG_FILE" "['geo-update-interval']" "YAML.safe_load('MjQ='.unpack1('m0').force_encoding('UTF-8'), aliases: true)"
# 配置说明：并发尝试域名解析得到的目标地址，缩短连接等待。整段赋值替换该公共字段。
ruby_edit "$CONFIG_FILE" "['tcp-concurrent']" "YAML.safe_load('dHJ1ZQ=='.unpack1('m0').force_encoding('UTF-8'), aliases: true)"
# 配置说明：从支持的协议提取域名，辅助规则匹配；下面的跳过条件优先。整段赋值替换该公共字段。
ruby_edit "$CONFIG_FILE" "['sniffer']" "YAML.safe_load(''.unpack1('m0').force_encoding('UTF-8'), aliases: true)"
# 配置说明：DNS 解析、缓存、fake-ip 和域名专用解析器设置。保留设备 DNS 监听/IPv6 字段后合并公共 DNS。
ruby_edit "$CONFIG_FILE" "['dns']" "(Value.fetch('dns', {}).select { |k, _| ['listen', 'ipv6', 'fake-ip-range6'].include?(k) }).merge(YAML.safe_load(''.unpack1('m0').force_encoding('UTF-8'), aliases: true))"
# 配置说明：策略组及其候选成员；订阅节点由客户端另行提供。整段赋值替换该公共字段。
ruby_edit "$CONFIG_FILE" "['proxy-groups']" "YAML.safe_load(''.unpack1('m0').force_encoding('UTF-8'), aliases: true)"
# 配置说明：远程规则集合的格式、下载与缓存设置。整段赋值替换该公共字段。
ruby_edit "$CONFIG_FILE" "['rule-providers']" "YAML.safe_load(''.unpack1('m0').force_encoding('UTF-8'), aliases: true)"
# 配置说明：自上而下匹配，首次有效命中决定策略；具体例外应放在通用兜底之前。整段赋值替换该公共字段。
ruby_edit "$CONFIG_FILE" "['rules']" "YAML.safe_load(''.unpack1('m0').force_encoding('UTF-8'), aliases: true)"
# 配置说明：进程匹配模式；路由器设为 off，不能识别远端手机的应用进程。整段赋值替换该公共字段。
ruby_edit "$CONFIG_FILE" "['find-process-mode']" "YAML.safe_load('Im9mZiI='.unpack1('m0').force_encoding('UTF-8'), aliases: true)"
# 配置说明：使用内置适配库处理当前订阅的 SS 精确别名及限定花云 UDP；保留 TFO/MPTCP/UOT/smux，源码见 .github/scripts/openclash_node_aliases.rb。
ruby_edit "$CONFIG_FILE" "['proxies']" "(lambda { |scope| scope.module_eval(''.unpack1('m0').force_encoding('UTF-8')); scope.const_get(:OpenClashNodeAliases).rewrite(Value.fetch('proxies', []), Value.fetch('hosts', {})) }).call(Module.new)"
