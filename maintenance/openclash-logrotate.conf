# Invoked by the existing OpenClash watchdog, once per loop.
# RAM storage: plugin restarts preserve archives; router reboots lose them.
# copytruncate preserves the writer's inode but has a small loss window.
/tmp/openclash.log {
    size 2M
    rotate 4
    missingok
    notifempty
    copytruncate
    compress
    delaycompress
    olddir /tmp/openclash-log-history
    createolddir 0700 root root
    su root root
}
