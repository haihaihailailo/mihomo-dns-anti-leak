越南服务 = select,DIRECT,越南-自动,越南节点,新加坡-自动,新加坡节点,香港-自动,香港节点,节点选择,policy-select-name=DIRECT,url=https://www.google.com.vn/generate_204,timeout=10
# 配置说明：策略组「AI」：手动选择候选，policy-select-name 指定初始首选；保存选择可能优先。policy-regex-filter 按节点名称筛选；timeout 为秒，测速不证明解锁。
