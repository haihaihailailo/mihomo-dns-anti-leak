  # 配置说明：当前策略组或覆写的显示名称。
  - name: 节点选择
    # 配置说明：对象类型：select 手选，url-test 自动测速，http 从远端下载规则。
    type: select
    # 配置说明：候选策略/节点列表；手选组首次默认取首项，已有保存选择可能优先。
    proxies:
      - DIRECT
      - 自动选择
      - 香港-自动
      - 香港节点
      - 台湾-自动
      - 台湾节点
      - 日本-自动
      - 日本节点
      - 新加坡-自动
      - 新加坡节点
      - 美国-自动
      - 美国节点
      - 越南-自动
      - 越南节点
      - 中国-自动
      - 中国节点
      - 全部节点
