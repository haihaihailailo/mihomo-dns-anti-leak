      - 台湾节点
      - 日本-自动
      - 日本节点
      - 新加坡-自动
      - 新加坡节点
      - 美国-自动
      - 美国节点
      - 越南-自动
      - 越南节点
      - 全部节点
      - DIRECT
    url: https://cp.cloudflare.com/generate_204
    expected-status: 204
    timeout: 10000
    icon: https://testingcf.jsdelivr.net/gh/clash-verge-rev/clash-verge-rev.github.io@main/docs/assets/icons/adjust.svg
  - name: 越南服务
